<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La Q'Fresa POS</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6336c">

</head>

<body>

<div class="contenedor">

<h2>🍓 LA Q'FRESA POS</h2>

<label>Mesero(a)</label>

<select id="cliente">

    <option>Juan</option>

    <option>Fabián</option>

    <option>Valentina</option>

    <option>Suplente</option>

</select>

<label>Nombre del vaso</label>
<input id="vaso" type="text">

<label>Cantidad</label>

<div class="contador">
  <button type="button" id="btnMenos">-</button>
  <span id="cantidad">1</span>
  <button type="button" id="btnMas">+</button>
</div>

<label>Producto</label>

<select id="producto">
<option value="">Seleccione...</option>

<option>Fresha School</option>
<option>Fresita</option>
<option>Fresota</option>
<option>Brownie con fruta</option>
<option>Suspiros</option>
<option>LaQ'Fresa</option>
<option>Helado</option>
<option>Merengón</option>
<option>Gelatina</option>
<option>Maracumango</option>
<option>Banana Split</option>

</select>

<h3 id="precio">$0</h3>

<hr>

<div id="ingredientes"></div>

<hr>


<button id="btnAgregarProducto">

Agregar producto

</button>

<hr>

<h3>Pedido</h3>

<div id="pedido"></div>
<h3>Total pedido</h3>

<h2 id="totalPedido">$0</h2>
<br>

<button id="btnEnviar">

Enviar a cocina

</button>

<br><br>

<label for="metodoPago">Método de pago</label>

<select id="metodoPago">
    <option value="">Seleccionar método de pago</option>
    <option value="Efectivo">Efectivo</option>
    <option value="Transferencia">Transferencia</option>
</select>

<div id="contenedorTipoTransferencia" style="display:none;">

    <label for="tipoTransferencia">Transferencia a:</label>

    <select id="tipoTransferencia">
        <option value="">Seleccionar cuenta</option>
        <option value="Nequi">Nequi</option>
        <option value="Daviplata">Daviplata</option>
    </select>

</div>

<button id="btnFinalizar">
Finalizar pedido
</button>

<hr>

<h3>Historial de pedidos</h3>

<label for="idPedidoBuscar">ID del pedido</label>

<input
  id="idPedidoBuscar"
  type="text"
  placeholder="Ejemplo: 20260711-001"
>

<button type="button" id="btnBuscarPedido">
Buscar pedido
</button>

<div id="resultadoBusqueda"></div>

<hr>

<div id="comanda"></div>

</div>

<script src="datos.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>

</body>
</html>
